name: Deploy do Backend no Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-railway-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar backend de staging
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install --global @railway/cli

      - name: Publicar no Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: >
          railway up backend --path-as-root --ci
          --service "$RAILWAY_BACKEND_SERVICE"
          --environment "$RAILWAY_ENVIRONMENT"
